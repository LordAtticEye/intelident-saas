# InteliDent SaaS - Configuración de Nginx en Producción (Proxy Inverso + SSL)
# Redirección forzada de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name intelident.cloud www.intelident.cloud;

    # Verificación de Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Seguro HTTPS (TLS 1.3 + HTTP/2)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intelident.cloud www.intelident.cloud;

    # Certificados SSL / TLS
    ssl_certificate /etc/letsencrypt/live/intelident.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intelident.cloud/privkey.pem;

    # Protocolos y Ciphers Fuertes (A+ en SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Cabeceras de Seguridad y Blindaje
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy inverso hacia el Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso hacia la API Backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
