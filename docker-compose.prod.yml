version: '3.8'

services:
  # -------------------------------------------------------------
  # Proxy Inverso Nginx con Terminación SSL/TLS
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: intelident-nginx-proxy
    restart: always
    ports:
      - "80:80"     # Redirección HTTP -> HTTPS
      - "443:443"   # Tráfico HTTPS cifrado TLS 1.3
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certs-data:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - intelident-prod-net

  # -------------------------------------------------------------
  # Aplicación Web Frontend (Next.js / React 19)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: intelident-frontend-prod
    restart: always
    expose:
      - "80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://intelident.cloud/api
    networks:
      - intelident-prod-net

  # -------------------------------------------------------------
  # Servidor Backend API (Express + TypeScript + IA Services)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: intelident-backend-prod
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb+srv://cesarcvti22_db_user:FljmQXsiAKEv95v8@cluster0.zkemtpn.mongodb.net/intelident_prod
      - JWT_SECRET=intelident_prod_secret_token_2026_jwt_auth_key
    networks:
      - intelident-prod-net

volumes:
  certs-data:
    driver: local

networks:
  intelident-prod-net:
    driver: bridge
