version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: intelident-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: intelident
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - intelident-net

  redis:
    image: redis:7-alpine
    container_name: intelident-redis
    restart: unless-stopped
    command: redis-server --requirepass changeme
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - intelident-net

  n8n:
    image: n8nio/n8n
    container_name: intelident-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - intelident-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: intelident-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: ./apps/backend/.env
    depends_on:
      - mongodb
      - redis
    networks:
      - intelident-net

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: intelident-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - intelident-net

volumes:
  mongo_data:
  redis_data:
  n8n_data:

networks:
  intelident-net:
    driver: bridge